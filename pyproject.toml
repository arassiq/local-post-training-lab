[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-post-training-lab"
version = "0.1.0"
description = "A local-first laboratory for fine-tuning and evaluating code models on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "arassiq" }]
dependencies = [
  "pyyaml>=6.0,<7",
  "torch>=2.5,<3",
  "transformers>=4.46,<6",

]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
posttrain = "posttrain_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/posttrain_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["posttrain_lab"]
